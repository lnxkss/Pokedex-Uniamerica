<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourdex - Perfil</title>
    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav class="sidebar"></nav>
    <div class="telaRow">
        <div class="nomePagina">
            <h2 class="nomePagP"><u>PERFIL</u></h2>
        </div>

        <div class="conteudo">
            <main class="perfil">
                <div class="perfil-topo">
                    <p>Gerenciar conta</p>
                </div>
                <div class="linha"></div>
                <div class="perfil-conteudo">
                    <section class="dados">
                        <h2>PlaceHolder</h2>
                        <div class="informacao">
                            <p><strong>Email:</strong> testeaaa@gmail.com</p>
                            <p><strong>Telefone:</strong> 45 **********</p>
                            <p><strong>Senha:</strong> ************</p>
                        </div>

                        <div class="botoes">
                            <button class="btn" onclick="window.location.href='editarPerfil.html'">EDITAR</button>
                            <button class="btn" onclick="window.location.href='ims/WIP.gif'">COMPARTILHAR PERFIL</button>
                        </div>
                    </section>

                    <section class="usuario">
                        <div class="foto-usuario">
                            <img src="imgs/perfil.webp" alt="Usuário">
                        </div>
                        <p>PlaceHolder</p>
                        <a href="pastas.html"><u>Minhas Pastas</u></a>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <div class="gtranslate_wrapper"></div>

    <script src="main.js"></script>
    <script src="traducaoAPI.js"></script>

    <script>
        window.gtranslateSettings = {
            "default_language": "pt",
            "native_language_names": true,
            "languages": ["pt", "en"],
            "wrapper_selector": ".gtranslate_wrapper",
            "alt_flags": { "en": "usa", "pt": "brazil" }
        };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/flags.js" defer></script>
</body>
</html>
