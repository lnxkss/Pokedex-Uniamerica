<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="css/perfil.css">

    <style>
        .gtranslate_wrapper, 
        #goog-gt-tt,

        }

        window.gtranslateSettings = {
            "default_language": "pt",
            "native_language_names": true,
            "languages": ["pt", "en"],
            "wrapper_selector": ".gtranslate_wrapper",
            "alt_flags": { "en": "usa", "pt": "brazil" }
        }
