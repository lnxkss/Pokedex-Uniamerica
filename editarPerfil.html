<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourdex - Editar Perfil</title>

    <link rel="stylesheet" href="css/editarPerfil.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <nav class="sidebar"></nav>
    <div class="telaRow">


        <div class="nomePagina">
            <h2 class="nomePagP"><u>EDITAR</u></h2>
        </div>
        <div class="conteudo">
            <main>
                <div class="editarPerfil">
                    <div class="perfil-topo">
                        <h1><strong>Meu Perfil</strong></h1>
                        <p><strong>Editar Perfil</strong></p>
                        <div class="linha"></div>
                    </div>


                    <div class="TypeText">

                        <div class="campo">
                            <h2>Nome:</h2>
                            <input type="text">
                            <img class="Lapis-campo" src="imgs/LápisEdição.webp" alt="Editar">
                        </div>

                        <div class="campo">
                            <h2>Email:</h2>
                            <input type="text">
                            <img class="Lapis-campo" src="imgs/LápisEdição.webp" alt="Editar">
                        </div>

                        <div class="campo">
                            <h2>Telefone:</h2>
                            <input type="text">
                            <img class="Lapis-campo" src="imgs/LápisEdição.webp" alt="Editar">
                        </div>

                        <div class="campo">
                            <h2>Senha:</h2>
                            <input type="password">
                            <img class="Lapis-campo" src="imgs/LápisEdição.webp" alt="Editar">
                        </div>

                    </div>



                    <div class="usuario">
                           <div class="linha-vertical"></div>
                        <div class="foto-usuario">
                            <img src="imgs/perfil.webp" alt="Usuário">
                        </div>
                        <div class="Lapis">
                            <img src="imgs/LápisEdição.webp" alt="Usuário">
                        </div>

                        <p>Valdiney</p>
                        <a href="#"><u>Meus Decks</u></a>
                    </div>

                    <div class="botoes">
                        <button class="btn">
                            <a href="perfil.html">
                                <p>SALVAR</p>
                            </a>
                        </button>
                        <button class="btnExcluir">
                            <a href="compartilharPerfil.html">
                                <p>EXCLUIR </p>
                            </a>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
