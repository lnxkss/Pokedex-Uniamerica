<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourdex - Perfil</title>
    <link rel="stylesheet" href="css/editarPerfil.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/variaveis.css">


</head>

<body>
    <nav class="sidebar"></nav>
    <div class="telaRow">

        <div class="nomePagina">
            <h2 class="nomePagP"><u>PERFIL</u></h2>
        </div>

        <div class="conteudo">
            <main class="perfil">
                <div class="perfil-topo">
                    <p>Meu Perfil</p>
                </div>
                <div class="perfil-topo1">
                    <p>Editar Perfil</p>
                </div>
                <div class="linha"></div>
                <div class="perfil-conteudo">

                    <section class="dados">

                        <div class="org">
                            <div class="barra">

                                <p>Nome:</p>

                                <div class="retangulo">
                                    <input type="text" placeholder="Insira seu Nome..">
                                    <img class="lapis" src="imgs/LápisEdição.webp" alt="">

                                </div>
                            </div>

                            <div class="barra">

                                <p>Email:</p>

                                <div class="retangulo">
                                    <input type="text" placeholder="Insira seu Email..">
                                    <img class="lapis" src="imgs/LápisEdição.webp" alt="">
                                </div>
                            </div>

                            <div class="barra">

                                <p>Telefone:</p>

                                <div class="retangulo">
                                    <input type="text" placeholder="Insira seu Número de telefone..">
                                    <img class="lapis" src="imgs/LápisEdição.webp" alt="">

                                </div>
                            </div>

                            <div class="barra">

                                <p>Senha:</p>

                                <div class="retangulo">
                                    <input type="text" placeholder="Insira sua Senha..">
                                    <img class="lapis" src="imgs/LápisEdição.webp" alt="">
                                </div>
                            </div>


                        </div>


                        <div class="botoes">

                            <button class="btn" onclick="window.location.href='imgs/WIP.gif'">SALVAR</button>
                            <button class="btn" onclick="window.location.href='imgs/WIP.gif'">EXCLUIR CONTA</button>

                        </div>
                    </section>


                    <section class="usuario">
                        <div class="foto-usuario">
                            <img src="imgs/perfil.webp" alt="Usuário">
                        </div>
                        <p>PlaceHolder</p>
                        <a href="imgs/WIP.gif"><u>Minhas Pastas</u></a>
                    </section>



                </div>



        </div>
    </div>
    
   
    
    <div class="gtranslate_wrapper"></div>

    <script src="main.js"></script>
    <script src="traducaoAPI.js"></script>

   
    <script>
        window.gtranslateSettings = {
            "default_language": "pt",
            "native_language_names": true,
            "languages": ["pt", "en"],
            "wrapper_selector": ".gtranslate_wrapper",
            "alt_flags": { "en": "usa", "pt": "brazil" }
        };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/flags.js" defer></script>



</body>

</html>
