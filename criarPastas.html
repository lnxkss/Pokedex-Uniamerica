<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fourdex - Criação de Pastas</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/pasta.css" />
  </head>
  <body>
    <nav class="sidebar"></nav>

    <div class="telaRow">
      <div class="nomePagina">
        <h2 class="nomePagP"><u>criar pasta</u></h2>
      </div>
      <div class="conteudo">
        <main class="quadradao telaCriar">
          <img src="imgs/Pastas.webp" alt="Pasta" class="pastadecriar" />

          <div class="input-container">
            <label class="colocarNome">Nome:</label>
            <input
              class="input"
              type="text"
              placeholder="Digite o nome da pasta..."
            />
          </div>

          <div class="botoes-container">
            <a href="pastas.html" style="text-decoration: none">
              <button class="botaoVoltar">Voltar</button>
            </a>

            <button class="botaoCriar">Criar</button>
          </div>
        </main>
      </div>
    </div>

    <div class="gtranslate_wrapper"></div>

    <script src="main.js"></script>
    <script src="criarPastas.js"></script>
    <script src="traducaoAPI.js"></script>

    <script>
        window.gtranslateSettings = {
            "default_language": "pt",
            "native_language_names": true,
            "languages": ["pt", "en"],
            "wrapper_selector": ".gtranslate_wrapper",
            "alt_flags": { "en": "usa", "pt": "brazil" }
        };
    </script>
    <script src="https://cdn.gtranslate.net/widgets/latest/flags.js" defer></script>
  </body>
</html>
